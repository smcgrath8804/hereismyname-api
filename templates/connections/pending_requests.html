{% extends "base.html" %}

{% block content %}

<h2>Pending Requests</h2>

{% if requests %}

    {% for connection in requests %}

    <div class="card mb-3">

        <div class="card-body">

            <h5 class="card-title">
                {{ connection.requester.username }}
            </h5>

            <p class="text-muted">
                {{ connection.requester.email }}
            </p>

            <form
                method="post"
                action="{% url 'connections:review_request' connection.id %}"
            >

                {% csrf_token %}

                <select
                    name="relationship"
                    class="form-select"
                >

                    <option value="public" selected>
                        Public
                    </option>

                    <option value="professional">
                        Professional
                    </option>

                    <option value="personal">
                        Personal
                    </option>

                    <option value="general">
                        General
                    </option>

                </select>

                <button
                    class="btn btn-primary mt-3"
                    type="submit"
                >
                    Save
                </button>

            </form>

        </div>

    </div>

{% endfor %}

{% else %}

    <div class="alert alert-secondary">
        You have no pending connection requests.
    </div>

{% endif %}

{% endblock %}
