{% extends "base.html" %}

{% block content %}

<h2>Find People</h2>

<form method="get">
    <input
        type="text"
        name="q"
        value="{{ query }}"
        placeholder="Search username"
    >

    <button type="submit">
        Search
    </button>
</form>

{% if users %}

    <ul>

    {% for user in users %}

        <li>{{ user.username }}</li>

    {% endfor %}

    </ul>

{% endif %}

{% endblock %}
