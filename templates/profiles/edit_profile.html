{% extends "base.html" %}

{% block title %}Edit Profile{% endblock %}

{% block content %}

<div class="row">

    <div class="col-md-8 col-lg-6">

        <h1 class="mb-4">
            Edit Profile
        </h1>

        <form method="post">

            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">
                    Display Name
                </label>
                {{ form.display_name }}
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Local Language Name
                </label>
                {{ form.local_language_name }}
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Email
                </label>
                {{ form.email }}
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Phone
                </label>
                {{ form.phone }}
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Job Title
                </label>
                {{ form.job_title }}
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Company
                </label>
                {{ form.company }}
            </div>

            <div class="mb-4">
                <label class="form-label">
                    Bio
                </label>
                {{ form.bio }}
            </div>

            <button
                type="submit"
                class="btn btn-primary">

                Save Changes

            </button>

        </form>

    </div>

</div>

{% endblock %}
